services:
  mongodb:
    image: mongo:8.0
    container_name: magic-film-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - magic-film-mongodb-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          "try { rs.status().ok } catch (e) {
          rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  magic-film-mongodb-data:
